name: ci

# workflow_dispatch is the manual escape hatch: without it, a push whose commits
# carry a skip-ci marker leaves code unvalidated with no way to launch a run short
# of pushing another commit.
#
# This replaced the Catalyst reusable workflow the fork inherited. That workflow
# gates every downstream job behind a `pre_job` eligibility step whose condition is
# `event == pull_request || (event == push && github.ref_protected)`. No branch on
# an ordinary fork is protected, so a push ran NOTHING and still reported success —
# a green tick on this repo was evidence of nothing at all.
#
# CI is not the only gate: each branch is mounted on its own local stacks
# (moodle-dev/plugins.conf: main on m503/m503b, MOODLE_502_STABLE on m502/m502b,
# MOODLE_501_STABLE on m501), so run `mdl ci <that checkout> --matrix` before pushing.
on:
  push:
    # Filtered to the merge targets. Without this, a push to a feature branch
    # ran the whole pipeline AND the pull_request event ran it again on the same
    # commit - double, for no extra information.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main or a MOODLE_*_STABLE branch - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/MOODLE_') }}

jobs:
  # Single reusable-workflow call for this branch's one Moodle version
  # (version.php $plugin->supported). main is the 5.3 branch; this is the
  # 5.2 branch, MOODLE_502_STABLE; each MOODLE_XX_STABLE branch names its own core.
  # Keep each branch's own form when resolving merges and cherry-picks.
  ci-502:
    name: Moodle 5.02
    uses: uaiblaine/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '' }}
      moodle-core-branch: MOODLE_502_STABLE
