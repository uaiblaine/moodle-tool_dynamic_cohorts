# Mutation spec for tool_dynamic_cohorts. On MOODLE_501_STABLE, run with
# `mdl mutate moodle-tool_dynamic_cohorts-501 moodle-tool_dynamic_cohorts-501/mutations/gates.conf --fast --branch MOODLE_501_STABLE`
# on both DB families (`--db pgsql`, `--db mariadb`).
#
# Each line breaks ONE guard and names the tests that must go red because of it. A guard whose
# mutation reddens nothing is held by no test, whatever its comment says. Run `--dry-run` first:
# a pattern that no longer matches its line is a hard error, not a pass.
#
#     tag | file relative to the repo | perl script relative to this file

# --- Saving a rule's conditions (classes/condition_manager.php) ---------------------------
# Accept a condition id that belongs to another rule: it is rewritten in place under that rule.
A_foreign_condition_id   | classes/condition_manager.php | a_foreign_condition_id.pl
#   -> test_process_form_refuses_a_condition_of_another_rule

# Accept any class name in conditionjson.
B_unknown_class          | classes/condition_manager.php | b_unknown_class.pl
#   -> test_process_form_refuses_invalid_condition
#   -> test_process_rule_form_refused_condition_writes_nothing

# Ignore the condition's own config validation on save.
C_config_validation      | classes/condition_manager.php | c_config_validation.pl
#   -> test_process_form_refuses_invalid_condition

# Let a TypeError raised by a condition escape instead of refusing the condition.
D_catch_throwable        | classes/condition_manager.php | d_catch_throwable.pl
#   -> test_process_form_refuses_invalid_condition

# Stop building the SQL on save: a condition whose get_sql() throws is stored for the observer.
E_get_sql_on_save        | classes/condition_manager.php | e_get_sql_on_save.pl
#   -> test_process_form_refuses_invalid_condition

# Revalidate every stored condition, unchanged or not: a rule with an uninstalled class cannot be saved.
F_unchanged_always_new   | classes/condition_manager.php | f_unchanged_always_new.pl
#   -> test_process_form_keeps_an_unchanged_stored_condition

# Treat a stored condition as unchanged whatever it now carries: its new config data is not validated.
G_unchanged_ignores_data | classes/condition_manager.php | g_unchanged_ignores_data.pl
#   -> test_process_form_keeps_an_unchanged_stored_condition

# --- Deleting rules (classes/external/rules.php) -------------------------------------------
# Drop the per-rule check: nothing decides the deletion at all.
H_delete_per_rule        | classes/external/rules.php     | h_delete_per_rule.pl
#   -> test_delete_rules_checks_each_rule_in_its_cohort_context
#   -> test_delete_rules_is_one_operation

# Hand the persistent the raw submitted id: "abc" passes the ownership check as 0, then is saved as an update.
I_checked_id             | classes/condition_manager.php | i_checked_id.pl
#   -> test_process_form_uses_the_checked_condition_id

# --- S1: managing rules in a course category (classes/local/rule_access.php and its callers) --
# Let the plugin capability alone manage rules, without moodle/cohort:assign.
J_cohort_assign_required | classes/local/rule_access.php | j_cohort_assign_required.pl
#   -> test_can_manage
#   -> test_rule_services_follow_the_cohort_context

# Accept any context id from a client, a course's included.
K_context_level          | classes/local/rule_access.php | k_context_level.pl
#   -> test_condition_form_service_context

# Decide get_total in the system context instead of the rule's.
L_get_total_context      | classes/external/matching_users.php | l_system_context.pl
#   -> test_rule_services_follow_the_cohort_context

# Decide get_conditions in the system context instead of the rule's.
M_get_conditions_context | classes/external/rule_conditions.php | l_system_context.pl
#   -> test_rule_services_follow_the_cohort_context

# Decide toggle_status in the system context instead of the rule's.
N_toggle_context         | classes/external/rules.php     | n_toggle_context.pl
#   -> test_rule_services_follow_the_cohort_context

# Saving a rule: stop checking the cohort it fills now (a rule in B could be moved to A).
O_old_cohort_check       | classes/rule_manager.php       | o_old_cohort_check.pl
#   -> test_moving_a_rule_needs_both_cohorts

# Saving a rule: stop checking the cohort it is pointed at.
P_new_cohort_check       | classes/rule_manager.php       | p_new_cohort_check.pl
#   -> test_saving_a_rule_needs_the_new_cohort
#   -> test_moving_a_rule_needs_both_cohorts

# The rule form's cohort list: every cohort, not only those at or below the page.
Q_cohort_list_inside     | classes/cohort_manager.php     | q_cohort_list_inside.pl
#   -> test_cohort_list_is_scoped

# The rule form's cohort list: keep cohorts the user may not attach a rule to.
R_cohort_list_access     | classes/cohort_manager.php     | r_cohort_list_access.pl
#   -> test_cohort_list_is_scoped

# Open an existing rule's form in the page's context instead of the rule's.
S_rule_form_rule_context | classes/rule_form.php          | s_rule_form_rule_context.pl
#   -> test_rule_form_access

# The condition modal's web service: no access check.
T_condition_service      | classes/external/condition_form.php | t_condition_service.pl
#   -> test_condition_form_service_context

# The matching-users report: decide on the context it was created in, not on its rule.
U_report_reads_rule      | classes/reportbuilder/local/systemreports/matching_users.php | u_report_reads_rule.pl
#   -> test_matching_users_report_reads_the_rule

# The matching-users fragment: leave the check to the report.
V_fragment_users         | lib.php                        | v_fragment_users.pl
#   -> test_fragments

# The condition-form fragment: no access check.
W_fragment_condition     | lib.php                        | w_fragment_condition.pl
#   -> test_fragments

# Deleting a rule: condition events look their context up after the rule is gone.
X_deleted_condition_ctx  | classes/condition_manager.php  | x_deleted_condition_ctx.pl
#   -> test_events_carry_the_rule_context

# A rule id that does not exist must be refused like one out of reach, never reported as missing.
Y_form_missing_rule      | classes/rule_form.php          | y_form_missing_rule.pl
#   -> test_rule_form_access

Z_report_missing_rule    | classes/reportbuilder/local/systemreports/matching_users.php | z_report_missing_rule.pl
#   -> test_matching_users_report_reads_the_rule

AA_save_missing_rule     | classes/rule_manager.php       | aa_save_missing_rule.pl
#   -> test_saving_a_rule_needs_the_new_cohort

# --- S2: the rules page in a course category (classes/local/rules_page.php, the rules report) --
# Open the page without deciding access.
AB_page_access           | classes/local/rules_page.php   | ab_page_access.pl
#   -> test_setup_access

# The page's warnings read every rule, not the category's subtree.
AC_rules_in_subtree      | classes/local/rules_page.php   | ac_rules_in_subtree.pl
#   -> test_rules_in

# Offer the category navigation node to anyone.
AD_navigation_access     | classes/local/rules_page.php   | ad_navigation_access.pl
#   -> test_category_navigation

# The rules report in a category lists every rule of the site.
AE_report_subtree        | classes/reportbuilder/local/systemreports/rules.php | ae_report_subtree.pl
#   -> test_report_rows

# Row actions decided on the page's access instead of each rule's.
AF_report_row_actions    | classes/reportbuilder/local/systemreports/rules.php | af_report_row_actions.pl
#   -> test_report_row_actions

# An INNER JOIN hides a rule whose cohort is gone, even from the system page.
AG_report_orphans        | classes/reportbuilder/local/systemreports/rules.php | ag_report_orphans.pl
#   -> test_report_rows

# The rules report: accept a course context, which inherits a category manager's capabilities.
AH_report_context_level  | classes/reportbuilder/local/systemreports/rules.php | ah_report_context_level.pl
#   -> test_report_rows
