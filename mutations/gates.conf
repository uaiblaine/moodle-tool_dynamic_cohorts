# Mutation spec for tool_dynamic_cohorts. On MOODLE_501_STABLE, run with
# `mdl mutate moodle-tool_dynamic_cohorts-501 moodle-tool_dynamic_cohorts-501/mutations/gates.conf --fast --branch MOODLE_501_STABLE`
# on both DB families (`--db pgsql`, `--db mariadb`).
#
# Each line breaks ONE guard and names the tests that must go red because of it. A guard whose
# mutation reddens nothing is held by no test, whatever its comment says. Run `--dry-run` first:
# a pattern that no longer matches its line is a hard error, not a pass.
#
#     tag | file relative to the repo | perl script relative to this file

# --- Saving a rule's conditions (classes/condition_manager.php) ---------------------------
# Accept a condition id that belongs to another rule: it is rewritten in place under that rule.
A_foreign_condition_id   | classes/condition_manager.php | a_foreign_condition_id.pl
#   -> test_process_form_refuses_a_condition_of_another_rule

# Accept any class name in conditionjson.
B_unknown_class          | classes/condition_manager.php | b_unknown_class.pl
#   -> test_process_form_refuses_invalid_condition
#   -> test_process_rule_form_refused_condition_writes_nothing

# Ignore the condition's own config validation on save.
C_config_validation      | classes/condition_manager.php | c_config_validation.pl
#   -> test_process_form_refuses_invalid_condition

# Let a TypeError raised by a condition escape instead of refusing the condition.
D_catch_throwable        | classes/condition_manager.php | d_catch_throwable.pl
#   -> test_process_form_refuses_invalid_condition

# Stop building the SQL on save: a condition whose get_sql() throws is stored for the observer.
E_get_sql_on_save        | classes/condition_manager.php | e_get_sql_on_save.pl
#   -> test_process_form_refuses_invalid_condition

# Revalidate every stored condition, unchanged or not: a rule with an uninstalled class cannot be saved.
F_unchanged_always_new   | classes/condition_manager.php | f_unchanged_always_new.pl
#   -> test_process_form_keeps_an_unchanged_stored_condition

# Treat a stored condition as unchanged whatever it now carries: its new config data is not validated.
G_unchanged_ignores_data | classes/condition_manager.php | g_unchanged_ignores_data.pl
#   -> test_process_form_keeps_an_unchanged_stored_condition

# --- Deleting rules (classes/external/rules.php) -------------------------------------------
# Decide every rule in the system context only.
H_delete_per_rule        | classes/external/rules.php     | h_delete_per_rule.pl
#   -> test_delete_rules_checks_each_rule_in_its_cohort_context

# Hand the persistent the raw submitted id: "abc" passes the ownership check as 0, then is saved as an update.
I_checked_id             | classes/condition_manager.php | i_checked_id.pl
#   -> test_process_form_uses_the_checked_condition_id
